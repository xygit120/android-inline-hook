name: Build ShadowHook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.22.1     # 使用稳定版本

      - name: Build ShadowHook
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadowhook-libs
          path: |
            shadowhook/build/intermediates/cmake/release/obj/
            shadowhook/build/outputs/aar/
